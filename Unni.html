@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
  --bg:#0F1524; --surface:#161D31; --surfaceAlt:#1D2540;
  --gold:#D4A657; --coral:#E8734A; --text:#F1F0EC; --muted:#8B92A8; --line:#2A3350;
}
*{box-sizing:border-box;overflow-wrap:break-word;word-break:break-word;max-width:100%;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden;width:100%;max-width:100%;height:100%;}
html{height:100%;height:100dvh;}
body{min-height:100%;min-height:100dvh;position:relative;}
.display{font-family:'Fraunces',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit;max-width:100%;}
input,select,textarea{font-family:inherit;max-width:100%;}
img{max-width:100%;height:auto;}
#root{min-height:100%;min-height:100dvh;overflow-x:hidden;width:100%;max-width:100%;position:relative;}
.center{display:flex;align-items:center;justify-content:center;min-height:100dvh;flex-direction:column;padding:0 24px;padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right));text-align:center;width:100%;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,0.18);width:100%;max-width:100%;}
.pill{border-radius:999px;}
.muted{color:var(--muted);}
.gold{color:var(--gold);}
.row{display:flex;align-items:center;min-width:0;max-width:100%;}
.grow{flex:1;min-width:0;}
.gap2>*+*{margin-left:8px;}
.stack{width:100%;max-width:100%;}
.stack>*+*{margin-top:8px;}
.icon-btn{padding:8px;border-radius:10px;flex-shrink:0;}
.icon-btn:active{opacity:.6;}
.field{width:100%;max-width:100%;background:var(--surfaceAlt);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px 14px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none;}
select.field{padding-right:28px;}
.btn-primary{background:var(--gold);color:var(--bg);border-radius:12px;padding:11px;font-weight:600;font-size:17px;text-align:center;width:auto;max-width:100%;}
.btn-primary:disabled{opacity:.5;}
.btn-ghost{border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:10px;font-size:16px;text-align:center;max-width:100%;}
.btn-danger{background:var(--coral);color:var(--bg);border-radius:10px;padding:9px;font-size:16px;font-weight:600;text-align:center;max-width:100%;}
.tab-content{padding:8px 14px calc(88px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));max-width:480px;width:100%;margin:0 auto;box-sizing:border-box;}
.header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 8px;padding-top:max(12px,env(safe-area-inset-top));padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));max-width:480px;width:100%;margin:0 auto;box-sizing:border-box;}
.header .row{min-width:0;flex-shrink:1;}
.navbar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:40;}
.navwrap{max-width:480px;margin:0 auto;display:flex;width:100%;}
.navitem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 2px 6px;min-width:0;}
.navlabel{font-size:11px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.dot{width:16px;height:16px;border-radius:999px;border:1px solid var(--line);flex-shrink:0;}
.dotfilled{background:var(--gold);border-color:var(--gold);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:280px;margin:0 auto;justify-items:center;}
.key{width:64px;height:64px;max-width:22vw;max-height:22vw;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:26px;}
.key:active{opacity:.6;}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;}
.statcard{padding:12px;text-align:left;min-width:0;}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0;}
.sheet{max-width:480px;width:100%;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px;padding-bottom:max(20px,env(safe-area-inset-bottom));max-height:min(85vh,85dvh);overflow-y:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box;}
.warnbox{border-radius:12px;padding:12px;display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.5;width:100%;box-sizing:border-box;}
.hidden{display:none !important;}
::placeholder{color:var(--muted);}
/* Keep priority / form rows from overflowing the screen */
.prio-row{display:flex;align-items:center;gap:6px;width:100%;min-width:0;}
.prio-row .field{flex:1;min-width:0;font-size:14px;padding:8px 10px;}
.prio-row select.field{flex:0 0 auto;width:88px;min-width:88px;font-size:12px;padding:6px 4px;}

/* Desktop: present as a centered app card instead of a stretched mobile page */
@media (min-width: 640px){
  body{
    background: radial-gradient(circle at 30% 20%, #1a2340 0%, #0F1524 65%);
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:32px 0;
  }
  #root{
    position:relative;
    width:420px;
    height:860px;
    max-height:92vh;
    border-radius:28px;
    overflow-y:auto;
    overflow-x:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 0 1px var(--line);
    background:var(--bg);
  }
  #root::-webkit-scrollbar{ width:0; }
  .navbar{ position:absolute; border-radius:0 0 28px 28px; }
  .sheet-overlay{ position:absolute; border-radius:28px; overflow:hidden; }
  .sheet{ max-height:70%; }
  .center{ min-height:100%; }
}
@media (max-width: 360px){
  .field{font-size:15px;padding:11px 12px;}
  .btn-primary{font-size:16px;}
  .navlabel{font-size:10px;}
  .header .display{font-size:22px !important;}
}

/* Civil Malayalam (Kollavarsham) approximation — Chingam 1 ≈ 16 Aug, month lengths solar-style. */
function malayalamDateParts(d){
  const gYear = d.getFullYear();
  const chingam1 = (y) => new Date(y, 7, 16); // Aug 16 local
  let c1 = chingam1(gYear);
  let meYear = gYear - 825;
  const dayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if (dayStart < c1){
    c1 = chingam1(gYear - 1);
    meYear = gYear - 826;
  }
  const dayIndex = Math.round((dayStart - c1) / 86400000);
  const lens = [31,31,31,31,31,30,30,30,30,30,30,30];
  let rem = dayIndex, mi = 0;
  while (mi < 12 && rem >= lens[mi]){ rem -= lens[mi]; mi++; }
  if (mi > 11){ mi = 11; rem = lens[11] - 1; }
  return { weekday: ML_WEEKDAYS[d.getDay()], day: rem + 1, month: ML_MONTHS[mi], year: meYear };
}
function malayalamDateLabel(d){
  const p = malayalamDateParts(d || new Date());
  return `${p.weekday}, ${p.day} ${p.month} ${p.year}`;
}
function currentDateLabel(){
  const now = new Date();
  return `${WEEKDAYS_EN[now.getDay()]}, ${fmtDate(now)} · ${malayalamDateLabel(now)}`;
}

// Google News RSS in Malayalam via CORS proxies. Three sections.
function parseRssXml(xmlText){
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  if (doc.querySelector('parsererror')) throw new Error('bad xml');
  return Array.from(doc.querySelectorAll('item')).map(el => ({
    title: (el.querySelector('title')?.textContent || '').trim(),
    url: (el.querySelector('link')?.textContent || '').trim(),
    pubDate: (el.querySelector('pubDate')?.textContent || '').trim()
  })).filter(it => it.title && it.url);
}
async function fetchNewsSection(rssUrl){
  const attempts = [
    async () => {
      const res = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(rssUrl));
      if (!res.ok) throw new Error('bad response');
      return parseRssXml(await res.text());
    },
    async () => {
      const res = await fetch('https://corsproxy.io/?url=' + encodeURIComponent(rssUrl));
      if (!res.ok) throw new Error('bad response');
      return parseRssXml(await res.text());
    },
    async () => {
      const res = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rssUrl));
      if (!res.ok) throw new Error('bad response');
      const data = await res.json();
      if (data.status !== 'ok' || !data.items) throw new Error('bad status');
      return data.items.map(it => ({ title: it.title, url: it.link, pubDate: it.pubDate }));
    }
  ];
  for (const attempt of attempts){
    try {
      const result = await attempt();
      if (result && result.length) return result;
    } catch(e){ /* try next */ }
  }
  return null;
}

async function fetchOnThisDay(force){
  const md = todayMonthDay();
  if (!force){
    const cached = await loadPlain('unni:otd_cache', null);
    if (cached && cached.monthDay === md && cached.version === OTD_CACHE_VERSION){ S.onThisDay = cached; render(); return; }
  }
  S.onThisDayLoading = true; S.onThisDayError = false; render();
  const [mm, dd] = md.split('-');
  const toItem = (e, kind, lang) => ({
    text: lang === 'ml'
      ? `${e.year}: ${e.text}`
      : (kind === 'births' ? `${e.year}: ${e.text} was born.`
        : kind === 'deaths' ? `${e.year}: ${e.text} died.`
        : `${e.year}: ${e.text}`),
    url: (e.pages && e.pages[0] && e.pages[0].content_urls && e.pages[0].content_urls.desktop && e.pages[0].content_urls.desktop.page) || 'https://en.wikipedia.org/wiki/Portal:Current_events',
    year: e.year
  });
  const collect = (data, lang) => {
    const seen = new Set();
    let all = [];
    ['events','births','deaths','selected'].forEach(kind => {
      (data[kind] || []).forEach(e => {
        const item = toItem(e, kind, lang);
        if (item.text && item.url && !seen.has(item.text)){ seen.add(item.text); all.push(item); }
      });
    });
    return all;
  };
  try {
    // Try Malayalam Wikipedia first — it's a much smaller wiki, so its
    // day pages are often too sparse for this feed to return anything
    // usable. If so, we fall back to English rather than show nothing.
    let all = [], lang = 'ml';
    try {
      const resMl = await fetch(`https://ml.wikipedia.org/api/rest_v1/feed/onthisday/all/${mm}/${dd}`);
      if (resMl.ok){
        const dataMl = await resMl.json();
        all = collect(dataMl, 'ml');
      }
    } catch(e){ /* fall through to English */ }

    if (all.length < 3){
      lang = 'en';
      const resEn = await fetch(`https://en.wikipedia.org/api/rest_v1/feed/onthisday/all/${mm}/${dd}`);
      if (!resEn.ok) throw new Error('bad response');
      const dataEn = await resEn.json();
      all = collect(dataEn, 'en');
    }

    const keralaIndiaRegex = lang === 'ml'
      ? /ഇന്ത്യ|കേരള|കൊച്ചി|കോഴിക്കോട്|തിരുവനന്തപുരം|തൃശ്ശൂർ|കണ്ണൂർ|കൊല്ലം|ആലപ്പുഴ|മലബാർ|തിരുവിതാംകൂർ|മലയാളം/
      : /\b(india|indian|kerala|malayal|kochi|cochin|kozhikode|calicut|thiruvananthapuram|trivandrum|thrissur|kannur|kollam|alleppey|alappuzha|malabar|travancore|cochin state|madras presidency)\b/i;
    const indiaRelated = all.filter(e => keralaIndiaRegex.test(e.text)).sort((a,b) => b.year - a.year);
    let chosen, isIndiaSpecific;
    if (indiaRelated.length >= 3){
      chosen = indiaRelated.slice(0, 7);
      isIndiaSpecific = true;
    } else if (indiaRelated.length > 0){
      // Not many India matches today — show what's real, then fill
      // the rest with global picks rather than padding with noise.
      const fillers = all.filter(e => !indiaRelated.includes(e)).slice(0, 4 - indiaRelated.length);
      chosen = [...indiaRelated, ...fillers];
      isIndiaSpecific = true;
    } else {
      chosen = all.slice(0, 4);
      isIndiaSpecific = false;
    }
    if (!chosen.length) throw new Error('empty');

    // If we ended up on English, try machine-translating the final
    // picks to Malayalam so there's something readable either way.
    // This uses Google's public translate endpoint — free and
    // CORS-open, but unofficial and not guaranteed to stay available,
    // and it's machine translation, not native Malayalam text.
    let translated = false;
    if (lang === 'en'){
      try {
        const results = await Promise.all(chosen.map(item => translateToMalayalam(item.text)));
        if (results.every(r => r)){
          chosen = chosen.map((item, i) => ({ ...item, text: results[i], originalText: item.text }));
          translated = true;
        }
      } catch(e){ /* keep English if translation fails */ }
    }

    S.onThisDay = { monthDay: md, items: chosen, indiaCount: indiaRelated.length, isIndiaSpecific, source: 'wikipedia', lang, translated, version: OTD_CACHE_VERSION };
    await savePlain('unni:otd_cache', S.onThisDay);
  } catch(e){
    S.onThisDayError = true;
  }
  S.onThisDayLoading = false;
  render();
}


/* ================= CRYPTO ================= */
const PBKDF2_ITER = 150000;
function toB64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function fromB64(str){ return Uint8Array.from(atob(str), c => c.charCodeAt(0)); }
async function deriveKey(pin, saltB64){
  const enc = new TextEncoder();
  const salt = fromB64(saltB64);
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:PBKDF2_ITER, hash:'SHA-256'}, baseKey, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
}
async function keyVerifier(key){
  const raw = await crypto.subtle.exportKey('raw', key);
  const hash = await crypto.subtle.digest('SHA-256', raw);
  return toB64(hash);
}
async function encryptJSON(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = new TextEncoder().encode(JSON.stringify(obj));
  const cipher = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, data);
  return {iv: toB64(iv), data: toB64(cipher)};
}
async function decryptJSON(key, payload){
  const iv = fromB64(payload.iv);
  const cipher = fromB64(payload.data);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, cipher);
  return JSON.parse(new TextDecoder().decode(plain));
}

/* ================= STORAGE ================= */
// This file can run two ways: inside Claude (where window.storage is
// injected and syncs to your account) or saved locally and opened
// directly in a browser (no bridge exists there — falls back to this
// browser's own localStorage instead, kept only on this device).
let STORAGE_MODE = null;
async function detectStorageMode(){
  if (STORAGE_MODE) return STORAGE_MODE;
  const start = Date.now();
  while (typeof window.storage === 'undefined' && Date.now()-start < 1200){
    await new Promise(r=>setTimeout(r,100));
  }
  STORAGE_MODE = (typeof window.storage !== 'undefined') ? 'claude' : 'local';
  return STORAGE_MODE;
}
async function loadPlain(key, fallback){
  const mode = await detectStorageMode();
  try {
    if (mode === 'claude'){
      const res = await window.storage.get(key, false);
      return res ? JSON.parse(res.value) : fallback;
    } else {
      const raw = localStorage.getItem('unni:'+key);
      return raw !== null ? JSON.parse(raw) : fallback;
    }
  } catch { return fallback; }
}
async function savePlain(key, value){
  const mode = await detectStorageMode();
  if (mode === 'claude'){
    for (let attempt=0; attempt<3; attempt++){
      try { const result = await window.storage.set(key, JSON.stringify(value), false); if (result) return true; }
      catch(e){ console.error('storage save failed', key, e); }
      await new Promise(r=>setTimeout(r,200));
    }
    return false;
  } else {
    try { localStorage.setItem('unni:'+key, JSON.stringify(value)); return true; }
    catch(e){ console.error('localStorage save failed', key, e); return false; }
  }
}
async function deletePlain(key){
  const mode = await detectStorageMode();
  try {
    if (mode === 'claude') await window.storage.delete(key, false);
    else localStorage.removeItem('unni:'+key);
  } catch {}
}
async function saveEnc(key, cryptoKey, value){ const payload = await encryptJSON(cryptoKey, value); await savePlain(key, payload); }
async function loadEnc(key, cryptoKey, fallback){
  const payload = await loadPlain(key, null);
  if (!payload) return fallback;
  try { return await decryptJSON(cryptoKey, payload); } catch { return fallback; }
}

function chime(){

    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.setValueAtTime(0.15, ctx.currentTime);
    o.start(); o.stop(ctx.currentTime+0.6);
  }catch{}
}
function bumpBadge(){

function notify(title, body){
  chime();

  if (window.Notification && Notification.permission === 'granted'){
    // requireInteraction keeps it on screen until dismissed instead of
    // auto-hiding after a few seconds — supported on Android Chrome,
    // NOT on iOS Safari, and only while this tab is actually open (no
    // backend here means no true OS-level push when the app is closed).
    try{ new Notification(title, {body, requireInteraction:true}); }catch{}
  }
  sendTelegramMessage(`${title}\n${body}`);
}
// Telegram's Bot API is genuinely reliable and CORS-friendly (unlike
// the news sources elsewhere in this app) — once sent, delivery goes
// through Telegram's own real push notification system, which works
// even with your phone screen off. The one real limit: this app still
// has to be open and running to trigger the send at the right moment —
// there's no backend here to do it while the app is fully closed.
async function sendTelegramMessage(text){
  if (!S.telegramToken || !S.telegramChatId) return {ok:false, error:'Not configured'};
  // Telegram's Bot API doesn't send CORS headers on its responses, which
  // was likely silently blocking our earlier POST+JSON request before it
  // even left the browser. A plain GET with query params counts as a
  // "simple request" under CORS rules, so it actually gets sent even
  // though we may not always be able to read the response back.
  const url = `https://api.telegram.org/bot${S.telegramToken}/sendMessage?chat_id=${encodeURIComponent(S.telegramChatId)}&text=${encodeURIComponent(text)}`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (!data.ok) return {ok:false, error: data.description || 'Telegram rejected the request.'};
    return {ok:true};
  } catch(e){
    // Response was likely blocked from being read by CORS, but the
    // request itself may still have gone through and been delivered.
    return {ok:null, error:"Sent, but the browser blocked reading Telegram's response — check Telegram to see if it actually arrived."};
  }
}

/* ================= CLOUD ALERTS (app closed / screen off) =================
   The phone cannot run JS when the app is fully closed. A free cloud
   scheduler (Google Apps Script or Cloudflare Worker) holds the next
   alarms and calls Telegram at the right minute — Telegram then pushes
   to your phone even if the screen is off. */
function buildCloudAlarms(){
  const alarms = [];
  const now = Date.now();
  const horizon = now + 14 * 24 * 60 * 60 * 1000; // next 14 days

  // Timed reminders: 5 min before + due
  (S.reminders || []).forEach(r => {
    if (r.done || r.kind !== 'timed' || !r.when) return;
    const t = new Date(r.when).getTime();
    if (t > now && t < horizon){
      alarms.push({ id: r.id + '::5min', at: t - 5*60*1000, text: '⏰ Reminder in 5 minutes\n' + r.title });
      alarms.push({ id: r.id + '::due', at: t, text: '🔔 Unni reminder\n' + r.title });
    }
  });

  // Daily except Sunday: next 14 weekdays at time and 5 min before
  (S.reminders || []).forEach(r => {
    if (r.done || r.kind !== 'dailyExceptSunday' || !r.time) return;
    const [rh, rm] = r.time.split(':').map(Number);
    for (let i = 0; i < 14; i++){
      const d = new Date();
      d.setDate(d.getDate() + i);
      d.setHours(rh, rm, 0, 0);
      if (d.getDay() === 0) continue;
      const t = d.getTime();
      if (t <= now || t >= horizon) continue;
      const dayKey = d.toISOString().slice(0, 10);
      alarms.push({ id: r.id + '::5min::' + dayKey, at: t - 5*60*1000, text: '⏰ Reminder in 5 minutes\n' + r.title });
      alarms.push({ id: r.id + '::due::' + dayKey, at: t, text: '🔔 Unni reminder\n' + r.title });
    }
  });

  // Daily checklist with date: 8:00, 19:00, 20:00
  (S.reminders || []).forEach(r => {
    if (r.done || r.kind !== 'daily' || !r.date) return;
    [[8,0,'8am'],[19,0,'7pm'],[20,0,'8pm']].forEach(([h,m,tag]) => {
      const d = new Date(r.date + 'T00:00:00');
      d.setHours(h, m, 0, 0);
      const t = d.getTime();
      if (t > now && t < horizon){
        alarms.push({ id: r.id + '::daily::' + tag, at: t, text: '📋 Daily checklist\n' + r.title });
      }
    });
  });

  // Tasks: 5 min before + due
  (S.tasks || []).forEach(t => {
    if (t.done || !t.due) return;
    const due = new Date(t.due).getTime();
    if (due > now && due < horizon){
      alarms.push({ id: t.id + '::5min', at: due - 5*60*1000, text: '⏰ Task in 5 minutes\n' + t.text });
      alarms.push({ id: t.id + '::due', at: due, text: '✅ Task due now\n' + t.text });
    }
  });

  // Important dates: prev day 9:00 & 21:00, day of 7:00
  (S.importantDates || []).forEach(d => {
    const next = nextOccurrence(d.date);
    const day = new Date(next.getFullYear(), next.getMonth(), next.getDate(), 7, 0, 0, 0);
    const prev = new Date(day); prev.setDate(prev.getDate() - 1);
    const slots = [
      { at: new Date(prev.getFullYear(), prev.getMonth(), prev.getDate(), 9, 0, 0, 0).getTime(), tag: 'prev9am', label: '📅 Important date tomorrow' },
      { at: new Date(prev.getFullYear(), prev.getMonth(), prev.getDate(), 21, 0, 0, 0).getTime(), tag: 'prev9pm', label: '📅 Important date tomorrow' },
      { at: day.getTime(), tag: 'day7am', label: '📅 Important date today' },
    ];
    slots.forEach(s => {
      if (s.at > now && s.at < horizon){
        alarms.push({ id: d.id + '::' + s.tag + '::' + day.toISOString().slice(0,10), at: s.at, text: s.label + '\n' + d.name + ' (' + d.category + ')' });
      }
    });
  });

  return alarms.sort((a,b) => a.at - b.at);
}

function normalizeCloudUrl(raw){
  if (!raw) return '';
  let url = String(raw).trim().replace(/\s+/g, '');
  // Common mistake: paste cut off mid-host
  if (/script\.google\.c$/i.test(url) || /script\.google\.co$/i.test(url)) return '';
  // Apps Script web app must end with /exec (or /dev for test)
  if (/script\.google\.com/i.test(url) && !/\/(exec|dev)\/?$/i.test(url) && !/\/macros\/s\//i.test(url)) {
    // incomplete
  }
  if (/script\.google\.com.*\/macros\/s\//i.test(url) && !/\/(exec|dev)\/?$/i.test(url)) {
    url = url.replace(/\/$/, '') + '/exec';
  }
  return url;
}
async function syncCloudAlarms(){
  if (!S.cloudUrl || !S.telegramToken || !S.telegramChatId) return {ok:false, error:'Cloud URL or Telegram not configured'};
  const alarms = buildCloudAlarms();
  const payload = {
    token: S.telegramToken,
    chatId: S.telegramChatId,
    secret: S.cloudSecret || '',
    alarms,
  };
  try {
    let url = normalizeCloudUrl(S.cloudUrl);
    if (!url || url.length < 40) {
      return {ok:false, error:'Cloud URL looks incomplete. Paste the FULL Web app URL (must end with /exec).'};
    }
    const isAppsScript = /script\.google\.com/i.test(url);
    if (!isAppsScript && !url.endsWith('/sync')) url = url.replace(/\/$/, '') + '/sync';

    if (isAppsScript){
      // text/plain + no preflight; redirect:follow for Apps Script
      const res = await fetch(url, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
      });
      // Apps Script often returns 200; CORS may hide body — treat network success as OK
      if (res.type === 'opaque' || res.ok || res.status === 0 || res.status === 200) {
        S.cloudLastSync = Date.now();
        await savePlain('unni:cloudLastSync', S.cloudLastSync);
        return {ok:true, count: alarms.length};
      }
      return {ok:false, error:'Apps Script returned HTTP ' + res.status + '. Redeploy Web app as Anyone + New version.'};
    }

    const headers = { 'Content-Type': 'application/json' };
    if (S.cloudSecret) headers['X-Sync-Secret'] = S.cloudSecret;
    const res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(payload) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false){
      return {ok:false, error: data.error || ('HTTP ' + res.status)};
    }
    S.cloudLastSync = Date.now();
    await savePlain('unni:cloudLastSync', S.cloudLastSync);
    return {ok:true, count: alarms.length};
  } catch(e){
    const msg = e.message || 'Network error';
    if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) {
      return {ok:false, error:'Failed to fetch — paste the FULL URL ending in /exec, set deployment to Anyone, and use New version after code changes.'};
    }
    return {ok:false, error: msg};
  }
}

function todayDateKey(){ const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; }
function alarmKey(id, tag){ return id + '::' + tag; }
function startNotificationLoop(){
  setInterval(async () => {
    if (!S.booted || S.locked || S.needsSetup) return;
    const now = Date.now();
    const nowDate = new Date();
    const hh = nowDate.getHours();
    const mm = nowDate.getMinutes();
    const hhmm = String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
    const todayKeyStr = todayDateKey();
    let changed = false;

    // --- Scheduled (timed) reminders: 5 min before + at due time ---
    (S.reminders||[]).forEach(r => {
      if (r.done || r.kind !== 'timed' || !r.when) return;
      const t = new Date(r.when).getTime();
      if (now >= t - 5*60*1000 && now < t && !S.firedAlarms.has(alarmKey(r.id,'5min'))){

    // --- Daily except Sunday: 5 min before + at set time (Mon–Sat) ---
    if (nowDate.getDay() !== 0){

        if (r.done || r.kind !== 'dailyExceptSunday' || !r.time) return;
        const [rh, rm] = r.time.split(':').map(Number);
        const dueMins = rh * 60 + rm;
        const nowMins = hh * 60 + mm;
        const fiveBefore = dueMins - 5;
        if (nowMins === fiveBefore && r.lastFired5minDate !== todayKeyStr){
          r.lastFired5minDate = todayKeyStr;

    }

    // --- Daily checklist: Telegram at 8:00, 19:00, 20:00 on the specific date ---
    const dailyAlerts = [
      {h:8, m:0, tag:'8am'},
      {h:19, m:0, tag:'7pm'},
      {h:20, m:0, tag:'8pm'}
    ];
    for (const slot of dailyAlerts){
      if (hh === slot.h && mm === slot.m){
        const dueDaily = (S.reminders||[]).filter(r =>
          !r.done && r.kind === 'daily' &&
          r.date && r.date === todayKeyStr &&
          r['lastDaily_'+slot.tag] !== todayKeyStr
        );
        if (dueDaily.length){
          dueDaily.forEach(r => notify('Daily checklist', r.title));
          S.reminders = S.reminders.map(r => {
            if (dueDaily.find(x => x.id === r.id)){
              return {...r, ['lastDaily_'+slot.tag]: todayKeyStr};
            }
            return r;
          });
          await saveEnc('unni:reminders', S.cryptoKey, S.reminders);
          changed = true;
        }
      }
    }

    // --- Tasks: 5 min before + at due time ---
    (S.tasks||[]).forEach(t => {
      if (t.done || !t.due) return;
      const dueTime = new Date(t.due).getTime();
      if (now >= dueTime - 5*60*1000 && now < dueTime && !S.firedAlarms.has(alarmKey(t.id,'5min'))){
        S.firedAlarms.add(alarmKey(t.id,'5min'));
        notify('Task in 5 minutes', t.text);
      }
      if (dueTime <= now && !S.firedAlarms.has(alarmKey(t.id,'due'))){
        S.firedAlarms.add(alarmKey(t.id,'due'));
        notify('Task due now', t.text);
      }
    });

    // --- Important Dates: previous day 9:00 & 21:00; day of 7:00 ---
    const tomorrow = new Date(nowDate); tomorrow.setDate(tomorrow.getDate()+1);
    const impSlots = [
      {h:9, m:0, match: tomorrow, tag:'prev9am', title:'Important date tomorrow'},
      {h:21, m:0, match: tomorrow, tag:'prev9pm', title:'Important date tomorrow'},
      {h:7, m:0, match: nowDate, tag:'day7am', title:'Important date today'}
    ];
    for (const slot of impSlots){
      if (hh === slot.h && mm === slot.m){
        const dueDates = (S.importantDates||[]).filter(d =>
          nextOccurrence(d.date).toDateString() === slot.match.toDateString() &&
          d['telegram_'+slot.tag] !== todayKeyStr
        );
        if (dueDates.length){
          dueDates.forEach(d => notify(slot.title, `${d.name} (${d.category})`));
          S.importantDates = S.importantDates.map(d =>
            dueDates.find(x => x.id === d.id) ? {...d, ['telegram_'+slot.tag]: todayKeyStr} : d
          );
          await saveEnc('unni:importantDates', S.cryptoKey, S.importantDates);
          changed = true;
        }
      }
    }

    if (changed && (S.tab==='dashboard'||S.tab==='tasks'||S.tab==='reminders'||S.tab==='importantdates')) render();
  }, 1000);
}

/* ================= UNLOCK ================= */
function pressKey(d){
  if (S.lockedFor>0 || S.lockBusy) return;
  if (d==='back'){ S.entry = S.entry.slice(0,-1); render(); return; }
  const next = (S.entry+d).slice(0,8);
  S.entry = next; render();
  if (S.expectedLength && next.length === S.expectedLength) submitUnlock(next);
}
async function submitUnlock(val){
  val = val || S.entry;
  if (!val) return;
  S.lockBusy = true; render();
  const now = Date.now();
  const lockUntil = await loadPlain('unni:lockUntil', 0);
  if (now < lockUntil){
    S.lockBusy=false; S.lockedFor = Math.ceil((lockUntil-now)/1000); S.entry=''; S.lockError='Too many attempts'; render();
    tickLockout(); return;
  }
  const salt = await loadPlain('unni:salt', null);
  const verifier = await loadPlain('unni:verifier', null);
  const key = await deriveKey(val, salt);
  const check = await keyVerifier(key);
  if (check !== verifier){
    const fails = (await loadPlain('unni:failCount', 0)) + 1;
    await savePlain('unni:failCount', fails);
    const secs = lockoutSeconds(fails);
    S.lockBusy = false; S.entry='';
    if (secs > 0){ await savePlain('unni:lockUntil', Date.now()+secs*1000); S.lockedFor = secs; S.lockError='Too many attempts'; render(); tickLockout(); }
    else { S.lockError = 'Incorrect PIN'; render(); setTimeout(()=>{S.lockError='';render();}, 1200); }
    return;
  }
  await savePlain('unni:failCount', 0);
  await savePlain('unni:lockUntil', 0);
  S.cryptoKey = key;
  S.tasks = await loadEnc('unni:tasks', key, []);
  S.reminders = await loadEnc('unni:reminders', key, []);
  S.vault = await loadEnc('unni:vault', key, []);
  S.profile = await loadEnc('unni:profile', key, {name:'', photo:null});
  S.notes = await loadEnc('unni:notes', key, []);
  S.customLinks = await loadEnc('unni:customLinks', key, {general:[],tv:[],newspapers:[],government:[]});
  S.importantDates = await loadEnc('unni:importantDates', key, []);
  S.documents = await loadEnc('unni:documents', key, []);
  S.followUps = await loadEnc('unni:followUps', key, []);
  S.habits = await loadEnc('unni:habits', key, []);
  S.leaveBalance = await loadEnc('unni:leaveBalance', key, {casual:20, earned:30, medical:20, special:0, other:0});
  S.leaveEntries = await loadEnc('unni:leaveEntries', key, []);
  S.priorities = await loadEnc('unni:priorities', key, []);
  const tg = await loadEnc('unni:telegram', key, {token:null, chatId:null});
  S.telegramToken = tg.token; S.telegramChatId = tg.chatId;
  const cloud = await loadEnc('unni:cloud', key, {url:null, secret:null});
  S.cloudUrl = cloud.url; S.cloudSecret = cloud.secret;
  S.cloudLastSync = await loadPlain('unni:cloudLastSync', null);
  S.lastBackupAt = await loadPlain('unni:lastBackupAt', null);
  applyAppIcon();
  S.locked = false; S.lockBusy=false; S.entry=''; S.lastActive = Date.now();
  render();
  fetchOnThisDay(false);
  fetchKeralaNews();
  fetchWeather();
  syncCloudAlarms();
}

  const iv = setInterval(() => {
    S.lockedFor = Math.max(0, S.lockedFor-1);

    if (S.lockedFor<=0) clearInterval(iv);

}

function handleProfilePhoto(files){
  const file = files[0];
  if (!file) return;
  S.profileError = '';
  if (!file.type.startsWith('image/')){ S.profileError = 'Please choose an image file.'; render(); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      // Shrink to a small thumbnail so a multi-MB camera photo doesn't
      // get re-embedded into every screen render and freeze the page.
      const maxDim = 320;
      let w = img.width, h = img.height;
      if (w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
      else if (h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      S.profileDraft.photo = canvas.toDataURL('image/jpeg', 0.82);
      render();
    };
    img.onerror = () => { S.profileError = "Couldn't read that image — try a different photo."; render(); };
    img.src = reader.result;
  };
  reader.onerror = () => { S.profileError = "Couldn't read that file."; render(); };
  reader.readAsDataURL(file);
}

async function buildBackupBundle(){
  const bundle = {app:'unni', version:1, exportedAt:new Date().toISOString(), keys:{}};
  const staticKeys = ['unni:salt','unni:verifier','unni:pinLength','unni:tasks','unni:reminders','unni:vault','unni:profile','unni:notes','unni:customLinks','unni:importantDates','unni:documents','unni:followUps','unni:habits','unni:telegram','unni:cloud','unni:leaveBalance','unni:leaveEntries','unni:priorities'];
  for (const k of staticKeys){
    const v = await loadPlain(k, null);
    if (v !== null) bundle.keys[k] = v;
  }
  return bundle;
}
async function exportBackup(){
  const bundle = await buildBackupBundle();
  const blob = new Blob([JSON.stringify(bundle)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'unni-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  S.lastBackupAt = Date.now();
  await savePlain('unni:lastBackupAt', S.lastBackupAt);
  render();
}

function startEdit(type, id){
  let item = null;
  if (type==='task') item = S.tasks.find(x=>x.id===id);
  else if (type==='reminder') item = S.reminders.find(x=>x.id===id);
  else if (type==='note') item = S.notes.find(x=>x.id===id);
  else if (type==='vault') item = S.vault.find(x=>x.id===id);
  else if (type==='date') item = S.importantDates.find(x=>x.id===id);
  else if (type==='followup') item = S.followUps.find(x=>x.id===id);
  if (!item) return;
  S.editItem = Object.assign({ type: type, id: id }, JSON.parse(JSON.stringify(item)));

}

async function saveEdit(){
  if (!S.editItem) return;
  const e = S.editItem;
  if (e.type==='task'){
    const text = document.getElementById('editField1').value.trim();
    if (!text) return;
    const due = document.getElementById('editField2').value || null;
    await persistTasks(S.tasks.map(t => t.id===e.id ? {...t, text, due} : t));
  } else if (e.type==='reminder'){
    const title = document.getElementById('editField1').value.trim();
    if (!title) return;
    await persistReminders(S.reminders.map(r => {
      if (r.id!==e.id) return r;
      const next = {...r, title};
      if (r.kind==='timed') next.when = document.getElementById('editField2').value || r.when;
      if (r.kind==='dailyExceptSunday') {
        const eh = document.getElementById('editRemHour');
        const em = document.getElementById('editRemMin');

        else next.time = (document.getElementById('editField2') && document.getElementById('editField2').value) || r.time;
      }
      if (r.kind==='daily') next.date = document.getElementById('editField2').value || null;
      return next;
    }));
  } else if (e.type==='note'){
    const text = document.getElementById('editField1').value.trim();
    if (!text) return;
    await persistNotes(S.notes.map(n => n.id===e.id ? {...n, text} : n));

    const label = document.getElementById('editField1').value.trim();

  } else if (e.type==='date'){
    const name = document.getElementById('editField1').value.trim();

    await persistDates(S.importantDates.map(d => d.id===e.id ? {...d, name, date, category: document.getElementById('editField3')?.value || d.category} : d));

      ...f,
      subject,

async function handleRestoreFile(file){
  if (!file) return;
  try{
    const text = await file.text();
    const bundle = JSON.parse(text);
    if (!bundle || !bundle.keys || !bundle.keys['unni:salt']) throw new Error('bad file');
    for (const [k,v] of Object.entries(bundle.keys)){
      await savePlain(k, v);
    }
    await savePlain('unni:failCount', 0);
    await savePlain('unni:lockUntil', 0);
    S.cryptoKey=null; S.tasks=[]; S.reminders=[]; S.vault=[]; S.profile={name:'',photo:null}; S.notes=[]; S.customLinks={general:[],tv:[],newspapers:[],government:[]}; S.importantDates=[]; S.documents=[]; S.followUps=[]; S.habits=[]; S.telegramToken=null; S.telegramChatId=null;
    S.needsSetup=false; S.locked=true; S.showSettings=false; S.settingsConfirmErase=false;
    S.entry=''; S.lockedFor=0;
    S.lockError='Backup restored — enter the PIN you used when you made that backup.';
    render();
  }catch(e){
    alert("That doesn't look like a valid Unni backup file.");
  }
}

  const dueEl = document.getElementById('taskDue');
  const val = valEl.value.trim(); const due = dueEl.value;
  if (!val) return;
  if (due) askNotifPerm();
  await persistTasks([{id:uid(), text:val, done:false, due:due||null, notified1hr:false, priority:S.taskDraftPriority||'normal', category:S.taskDraftCategory||'Personal', repeat:S.taskDraftRepeat||'none', createdAt:Date.now(), completedAt:null}, ...S.tasks]);

async function toggleTask(id){
  const t = S.tasks.find(t=>t.id===id);
  if (!t) return;
  const nowDone = !t.done;
  let next = S.tasks.map(x=>x.id===id?{...x, done:nowDone, completedAt: nowDone ? Date.now() : null}:x);
  // Completing a recurring task with a due date spins off the next occurrence automatically.
  if (nowDone && t.repeat && t.repeat !== 'none' && t.due){
    const nextDue = new Date(t.due);
    nextDue.setDate(nextDue.getDate() + (t.repeat === 'weekly' ? 7 : 1));
    if (t.repeat === 'exceptSunday' && nextDue.getDay() === 0) nextDue.setDate(nextDue.getDate()+1); // skip Sunday
    next = [{...t, id:uid(), done:false, completedAt:null, due:nextDue.toISOString().slice(0,16), notified1hr:false, createdAt:Date.now()}, ...next];
  }
  await persistTasks(next);
  render();
}

function isTaskToday(t){
  if (!t.due) return false;
  const d = new Date(t.due), now = new Date();
  return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
}

function copyVaultSecret(id, text){
  navigator.clipboard?.writeText(text);
  S.vaultCopied = id; render();
  setTimeout(()=>{ S.vaultCopied=null; render(); }, 1200);
  // Auto-clear the clipboard after 30s so a copied password doesn't
  // sit readable by other apps indefinitely — standard password
  // manager behavior. Only clears if it still holds what we copied.
  setTimeout(async () => {
    try {
      const current = await navigator.clipboard?.readText();
      if (current === text) await navigator.clipboard.writeText('');
    } catch(e){ /* clipboard read permission may be denied — nothing to do */ }
  }, 30000);
}

/* ---- Tasks ---- */
function tasksHTML(){
  const open = S.tasks.filter(t=>!t.done).length;
  const filters = [
    {id:'all', label:'All'},
    {id:'today', label:'Today'},
    {id:'pending', label:'Pending'},
    {id:'completed', label:'Completed'},
    {id:'overdue', label:'Overdue'},
  ];
  let filtered = S.tasks.filter(t => !(S.pendingDelete && S.pendingDelete.kind==='task' && S.pendingDelete.id===t.id)).filter(t => {
    if (S.taskFilter==='today') return isTaskToday(t);
    if (S.taskFilter==='pending') return !t.done;
    if (S.taskFilter==='completed') return t.done;
    if (S.taskFilter==='overdue') return isTaskOverdue(t);
    return true;
  });
  const sorters = {
    due: (a,b) => (a.due?new Date(a.due).getTime():Infinity) - (b.due?new Date(b.due).getTime():Infinity),
    priority: (a,b) => (b.priority==='high'?1:0) - (a.priority==='high'?1:0),
    created: (a,b) => (b.createdAt||0) - (a.createdAt||0),
  };
  filtered = [...filtered].sort(sorters[S.taskSort] || sorters.due);

  return `
  ${sectionTitle('Tasks', open+' open')}
  ${S.tasks.filter(t=>t.due&&!t.done).length > 1 ? `<button onclick="exportAllTasksToCalendar()" class="btn-ghost row" style="width:100%;justify-content:center;margin-bottom:8px;">${icon('calendarDay',16,MUTED)}<span style="margin-left:6px;">Export all to calendar</span></button>` : ''}
  ${S.tasks.length ? `<button onclick="exportTasksAsText()" class="btn-ghost row" style="width:100%;justify-content:center;margin-bottom:12px;">${icon('newspaper',16,MUTED)}<span style="margin-left:6px;">Share as plain text (unencrypted)</span></button>` : ''}
  <div class="stack" style="margin-bottom:8px;">
    <input id="taskInput" class="field" placeholder="Add a task" onkeydown="if(event.key==='Enter'&&!document.getElementById('taskDue').value)addTask()" />

      <input id="taskDue" type="datetime-local" class="field mono grow" />
      <button onclick="addTask()" class="btn-primary" style="padding:0 14px;">${icon('plus',24,'var(--bg)')}</button>
    </div>
    <div class="row" style="gap:8px;">
      <button onclick="setTaskDraftPriority('${S.taskDraftPriority==='high'?'normal':'high'}')" class="pill row" style="flex:1;justify-content:center;padding:7px;font-size:14px;background:${S.taskDraftPriority==='high'?'var(--coral)':'var(--surfaceAlt)'};color:${S.taskDraftPriority==='high'?'var(--bg)':'var(--muted)'};">${S.taskDraftPriority==='high'?'🔴 High priority':'Normal priority'}</button>
      <select onchange="setTaskDraftCategory(this.value)" class="field" style="flex:1;padding:9px 10px;">
        ${TASK_CATEGORIES.map(c=>`<option value="${c}" ${S.taskDraftCategory===c?'selected':''}>${c}</option>`).join('')}
      </select>
    </div>
    <select onchange="setTaskDraftRepeat(this.value)" class="field">
      ${TASK_REPEATS.map(r=>`<option value="${r.id}" ${S.taskDraftRepeat===r.id?'selected':''}>${r.label}</option>`).join('')}
    </select>
  </div>
  <p class="muted row" style="font-size:13px;margin-bottom:14px;">${icon('bell',13,GOLD)}<span style="margin-left:4px;">Set a time — Telegram alert 5 minutes before and at due time</span></p>

  <div class="row" style="gap:6px;margin-bottom:12px;flex-wrap:wrap;">
    ${filters.map(f=>`<button onclick="setTaskFilter('${f.id}')" class="pill" style="padding:6px 12px;font-size:13px;background:${S.taskFilter===f.id?'var(--gold)':'var(--surfaceAlt)'};color:${S.taskFilter===f.id?'var(--bg)':'var(--muted)'};">${f.label}</button>`).join('')}
  </div>
  <div class="row" style="gap:6px;margin-bottom:16px;align-items:center;">
    <span class="muted" style="font-size:13px;">Sort:</span>
    <button onclick="setTaskSort('due')" class="pill" style="padding:5px 10px;font-size:12px;background:${S.taskSort==='due'?'var(--surfaceAlt)':'transparent'};color:${S.taskSort==='due'?'var(--gold)':'var(--muted)'};border:1px solid var(--line);">Due date</button>
    <button onclick="setTaskSort('priority')" class="pill" style="padding:5px 10px;font-size:12px;background:${S.taskSort==='priority'?'var(--surfaceAlt)':'transparent'};color:${S.taskSort==='priority'?'var(--gold)':'var(--muted)'};border:1px solid var(--line);">Priority</button>
    <button onclick="setTaskSort('created')" class="pill" style="padding:5px 10px;font-size:12px;background:${S.taskSort==='created'?'var(--surfaceAlt)':'transparent'};color:${S.taskSort==='created'?'var(--gold)':'var(--muted)'};border:1px solid var(--line);">Newest</button>
  </div>

  <div class="stack">
    ${filtered.length===0 ? emptyState('Nothing here.') : filtered.map(t=>{

        <button onclick="scheduleDelete('task','${t.id}','Task deleted', () => persistTasks(S.tasks.filter(x=>x.id!=='${t.id}')))">${icon('trash',20,MUTED)}</button>
      </div>`;
    }).join('')}
  </div>`;
}

/* ---- Notes ---- */
async function persistNotes(next){ S.notes = next; if (S.cryptoKey) await saveEnc('unni:notes', S.cryptoKey, next); }
async function addNote(){
  const el = document.getElementById('noteInput');
  const text = el.value.trim();
  if (!text) return;
  await persistNotes([{id:uid(), text, createdAt: Date.now(), pinned:false}, ...S.notes]);
  el.value = '';
  render();
}
async function removeNote(id){ await persistNotes(S.notes.filter(n=>n.id!==id)); render(); }
async function toggleNotePin(id){ await persistNotes(S.notes.map(n=>n.id===id?{...n,pinned:!n.pinned}:n)); render(); }

/* ---- Quick Links ---- */
async function persistCustomLinks(next){ S.customLinks = next; if (S.cryptoKey) await saveEnc('unni:customLinks', S.cryptoKey, next); }
function openAddQuickLink(cat){ S.quickLinkAdding = cat; render(); }
function closeAddQuickLink(){ S.quickLinkAdding = null; render(); }
async function addQuickLink(cat){
  const nameEl = document.getElementById('qlName');
  const urlEl = document.getElementById('qlUrl');
  const name = nameEl.value.trim();
  let url = urlEl.value.trim();
  if (!name || !url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  const next = { ...S.customLinks, [cat]: [...(S.customLinks[cat]||[]), {id:uid(), name, url}] };
  await persistCustomLinks(next);
  S.quickLinkAdding = null;
  render();
}
async function removeQuickLink(cat, id){
  const next = { ...S.customLinks, [cat]: (S.customLinks[cat]||[]).filter(l=>l.id!==id) };
  await persistCustomLinks(next);

function formatIcsDateTime(date){ return date.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z'; }
function formatIcsDate(date){ return date.toISOString().slice(0,10).replace(/-/g,''); }
function downloadTextBlob(filename, text){
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;

}

function downloadIcsBlob(filename, icsText){
  const blob = new Blob([icsText], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;

// opts: { start: Date, allDay: bool, recurRule: string|null }
function buildIcsVevent(summary, opts){
  const lines = ['BEGIN:VEVENT', 'UID:'+uid()+'@unni.local', 'DTSTAMP:'+formatIcsDateTime(new Date())];
  lines.push(opts.allDay ? 'DTSTART;VALUE=DATE:'+formatIcsDate(opts.start) : 'DTSTART:'+formatIcsDateTime(opts.start));
  if (opts.recurRule) lines.push('RRULE:'+opts.recurRule);
  lines.push('SUMMARY:'+summary.replace(/,/g,'\\,'), 'END:VEVENT');
  return lines.join('\r\n');
}
function buildIcsCalendar(veventLines){
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Unni//EN', ...veventLines, 'END:VCALENDAR'].join('\r\n');
}
function buildIcsEvent(summary, opts){
  return buildIcsCalendar([buildIcsVevent(summary, opts)]);
}
function downloadIcs(filename, summary, dateObj){
  downloadIcsBlob(filename, buildIcsEvent(summary, {start:dateObj, allDay:true, recurRule:'FREQ=YEARLY'}));
}
function exportDateToCalendar(id){
  const d = S.importantDates.find(x=>x.id===id);
  if (!d) return;
  downloadIcs(d.name.replace(/[^a-z0-9]/gi,'_')+'.ics', d.name, nextOccurrence(d.date));
}
function taskCalendarOpts(t){
  const recurRule = t.repeat === 'daily' ? 'FREQ=DAILY' : t.repeat === 'weekly' ? 'FREQ=WEEKLY' : t.repeat === 'exceptSunday' ? 'FREQ=DAILY;BYDAY=MO,TU,WE,TH,FR,SA' : null;
  return {start: new Date(t.due), allDay:false, recurRule};
}
function exportTaskToCalendar(id){
  const t = S.tasks.find(x=>x.id===id);
  if (!t || !t.due) return;
  const ics = buildIcsEvent(t.text, taskCalendarOpts(t));
  downloadIcsBlob(t.text.replace(/[^a-z0-9]/gi,'_').slice(0,40)+'.ics', ics);
}
function reminderCalendarOpts(r){
  let start, recurRule = null;
  if (r.kind === 'timed'){
    start = new Date(r.when);
  } else if (r.kind === 'dailyExceptSunday' && r.time){
    const [h,m] = r.time.split(':').map(Number);
    start = new Date(); start.setHours(h, m, 0, 0);
    if (start < new Date()) start.setDate(start.getDate()+1);
    recurRule = 'FREQ=DAILY;BYDAY=MO,TU,WE,TH,FR,SA';
  } else {
    return null; // plain checklist reminders have no time to export
  }
  return {start, allDay:false, recurRule};
}
function exportReminderToCalendar(id){
  const r = S.reminders.find(x=>x.id===id);
  if (!r) return;
  const opts = reminderCalendarOpts(r);
  if (!opts) return;
  const ics = buildIcsEvent(r.title, opts);
  downloadIcsBlob(r.title.replace(/[^a-z0-9]/gi,'_').slice(0,40)+'.ics', ics);
}
function exportAllDatesToCalendar(){
  if (!S.importantDates.length) return;
  const vevents = S.importantDates.map(d => buildIcsVevent(d.name, {start: nextOccurrence(d.date), allDay:true, recurRule:'FREQ=YEARLY'}));
  downloadIcsBlob('unni-important-dates.ics', buildIcsCalendar(vevents));
}
function exportAllTasksToCalendar(){
  const withDates = S.tasks.filter(t => t.due && !t.done);
  if (!withDates.length) return;
  const vevents = withDates.map(t => buildIcsVevent(t.text, taskCalendarOpts(t)));

}
function exportAllRemindersToCalendar(){
  const exportable = S.reminders.filter(r => !r.done && reminderCalendarOpts(r));
  if (!exportable.length) return;
  const vevents = exportable.map(r => buildIcsVevent(r.title, reminderCalendarOpts(r)));
  downloadIcsBlob('unni-reminders.ics', buildIcsCalendar(vevents));
}

function habitStreak(h){
  let streak = 0;
  let d = new Date();
  // Count backwards from today; today not being checked yet doesn't break the streak.
  if (!h.log[todayKey()]) d.setDate(d.getDate()-1);
  while (true){
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (h.log[key]){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}

async function persistFollowUps(next){ S.followUps = next; if (S.cryptoKey) await saveEnc('unni:followUps', S.cryptoKey, next); }

function setFollowUpDraftStatus(s){ S.followUpDraftStatus = s; render(); }
function setFollowUpDraftPriority(p){ S.followUpDraftPriority = p; render(); }
async function addFollowUp(){
  const subject = document.getElementById('fuSubject').value.trim();
  if (!subject) return;

    id:uid(), subject,
    person: document.getElementById('fuPerson').value.trim(),
    refNumber: document.getElementById('fuRef').value.trim(),
    dueDate: document.getElementById('fuDue').value || null,

    priority: S.followUpDraftPriority,
    status: S.followUpDraftStatus,
    notes: document.getElementById('fuNotes').value.trim(),

  await persistFollowUps([fu, ...S.followUps]);
  S.showAddFollowUp = false; render();
}

function calcWorkingTime(){
  const inV = document.getElementById('wtIn').value, outV = document.getElementById('wtOut').value;
  if (!inV || !outV) return;
  const [ih,im] = inV.split(':').map(Number), [oh,om] = outV.split(':').map(Number);
  let mins = (oh*60+om) - (ih*60+im);
  if (mins < 0) mins += 24*60;
  const h = Math.floor(mins/60), m = mins%60;
  const diff = mins - 7*60;
  const diffTxt = diff === 0 ? 'Exactly 7 hours' : diff > 0 ? `${Math.floor(diff/60)}h ${diff%60}m over 7 hours` : `${Math.floor(-diff/60)}h ${-diff%60}m short of 7 hours`;
  document.getElementById('wtResult').textContent = `${h}h ${m}m worked — ${diffTxt}`;
}
function calcDateDiff(){
  const a = document.getElementById('ddFrom').value, b = document.getElementById('ddTo').value;
  if (!a || !b) return;
  const days = Math.round((new Date(b) - new Date(a)) / 86400000);
  document.getElementById('ddResult').textContent = `${days} day${days===1?'':'s'}`;
}
function calcAge(){
  const dob = document.getElementById('ageDob').value;
  if (!dob) return;
  const d = new Date(dob), now = new Date();
  let years = now.getFullYear() - d.getFullYear();
  let months = now.getMonth() - d.getMonth();
  let days = now.getDate() - d.getDate();
  if (days < 0){ months--; days += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if (months < 0){ years--; months += 12; }
  document.getElementById('ageResult').textContent = `${years} years, ${months} months, ${days} days`;
}
function calcPercentage(){
  const a = parseFloat(document.getElementById('pctA').value), b = parseFloat(document.getElementById('pctB').value);
  if (isNaN(a) || isNaN(b) || b === 0) return;
  document.getElementById('pctResult').textContent = `${((a/b)*100).toFixed(2)}%`;
}
function calcLakhCrore(){
  const v = parseFloat(document.getElementById('lcInput').value);
  if (isNaN(v)) return;
  document.getElementById('lcResult').textContent = `₹${v.toLocaleString('en-IN')} = ${(v/100000).toFixed(4)} Lakh = ${(v/10000000).toFixed(6)} Crore`;
}

function toggleSearch(v){
  S.showSearch = v;
  if (!v){ S.searchResults = null; S.searchQuery = ''; }

function runSearch(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  S.searchQuery = q;
  if (!q){ S.searchResults = []; render(); return; }
  const results = [];
  S.tasks.forEach(t => { if (t.text.toLowerCase().includes(q)) results.push({ kind:'Task', icon:'check', text:t.text, tab:'tasks' }); });
  S.reminders.forEach(r => { if (r.title.toLowerCase().includes(q)) results.push({ kind:'Reminder', icon:'bell', text:r.title, tab:'reminders' }); });
  S.notes.forEach(n => { if (n.text.toLowerCase().includes(q)) results.push({ kind:'Note', icon:'notepad', text:n.text.slice(0,80), tab:'notes' }); });
  S.vault.forEach(v => {
    const hay = (v.label + ' ' + (v.username||'')).toLowerCase();
    if (hay.includes(q)) results.push({ kind:'Vault (' + (v.folder||'Unni') + ')', icon: v.type==='card'?'card':'key', text:v.label, tab:'vault' });
  });
  S.searchResults = results;
  render();
}

      <div class="stack" style="margin-bottom:8px;">
        <input id="telegramTokenInput" type="password" class="field mono" placeholder="Bot token" value="${S.telegramToken ? escapeHTML(S.telegramToken) : ''}" />
        <input id="telegramChatIdInput" class="field mono" placeholder="Chat ID" value="${S.telegramChatId ? escapeHTML(S.telegramChatId) : ''}" />
      </div>
      <div class="row" style="gap:8px;margin-bottom:8px;">
        <button onclick="saveTelegramSettings()" class="btn-primary" style="flex:1;">Save</button>
        <button onclick="testTelegramMessage()" class="btn-ghost" style="flex:1;" ${(!S.telegramToken || !S.telegramChatId)?'disabled':''}>Send test</button>
      </div>
      ${S.telegramTestResult === 'sending' ? `<p class="muted" style="font-size:12px;margin:0 0 12px;">Sending…</p>` : S.telegramTestResult && S.telegramTestResult.ok === true ? `<p style="color:var(--gold);font-size:12px;margin:0 0 12px;">✅ Confirmed delivered — check Telegram.</p>` : S.telegramTestResult && S.telegramTestResult.ok === null ? `<p style="color:var(--gold);font-size:12px;margin:0 0 12px;">${escapeHTML(S.telegramTestResult.error)}</p>` : S.telegramTestResult && S.telegramTestResult.ok === false ? `<p style="color:var(--coral);font-size:12px;margin:0 0 12px;">❌ Failed: ${escapeHTML(S.telegramTestResult.error)}</p>` : ''}

      <h4 class="display" style="font-size:20px;margin:12px 0 8px;">Cloud alerts (app closed / screen off)</h4>
      <p class="muted" style="font-size:14px;line-height:1.5;margin:0 0 10px;">A free cloud timer (Google Apps Script — recommended with your Gmail — or Cloudflare Worker) holds your next alarms and sends Telegram even when Unni is closed. Paste the Web app URL from <code style="color:var(--gold);">apps-script.js</code> setup. After any change to tasks/reminders/dates, open Unni once so it can sync.</p>
      <div class="stack" style="margin-bottom:8px;">
        <label class="muted" style="font-size:12px;">Web app URL (must be the FULL link ending with /exec)</label>
        <textarea id="cloudUrlInput" class="field mono" rows="3" placeholder="https://script.google.com/macros/s/XXXX/exec" style="font-size:13px;line-height:1.4;resize:vertical;">${S.cloudUrl ? escapeHTML(S.cloudUrl) : ''}</textarea>
        <input id="cloudSecretInput" type="password" class="field mono" placeholder="Sync secret (optional — leave blank)" value="${S.cloudSecret ? escapeHTML(S.cloudSecret) : ''}" />
      </div>
      <div class="row" style="gap:8px;margin-bottom:8px;">
        <button onclick="saveTelegramSettings()" class="btn-primary" style="flex:1;">Save &amp; sync</button>
        <button onclick="manualCloudSync()" class="btn-ghost" style="flex:1;" ${(!S.cloudUrl || !S.telegramToken || !S.telegramChatId)?'disabled':''}>Sync now</button>
      </div>
      ${S.cloudSyncResult === 'syncing' ? `<p class="muted" style="font-size:12px;margin:0 0 16px;">Syncing alarms to cloud…</p>` : S.cloudSyncResult && S.cloudSyncResult.ok === true && S.cloudSyncResult.savedOnly ? `<p style="color:var(--gold);font-size:12px;margin:0 0 16px;">✅ ${escapeHTML(S.cloudSyncResult.message||'Saved')}</p>` : S.cloudSyncResult && S.cloudSyncResult.ok === true ? `<p style="color:var(--gold);font-size:12px;margin:0 0 16px;">✅ Cloud synced — ${S.cloudSyncResult.count} alarm(s). Last: ${S.cloudLastSync ? fmtDateTime(S.cloudLastSync) : 'just now'}</p>` : S.cloudSyncResult && S.cloudSyncResult.ok === false ? `<p style="color:var(--coral);font-size:12px;margin:0 0 8px;">❌ Sync failed: ${escapeHTML(S.cloudSyncResult.error)}</p>${S.cloudSyncResult.saved ? `<p class="muted" style="font-size:11px;margin:0 0 16px;">URL/token were still saved on this phone. Fix the URL/deployment, then Sync now.</p>` : `<div style="margin-bottom:16px;"></div>`}` : S.cloudLastSync ? `<p class="muted" style="font-size:12px;margin:0 0 16px;">Last cloud sync: ${fmtDateTime(S.cloudLastSync)}</p>` : `<div style="margin-bottom:16px;"></div>`}

      <h4 class="display" style="font-size:20px;margin:0 0 8px;">Auto-Lock Timeout</h4>
      <p class="muted" style="font-size:14px;line-height:1.5;margin:0 0 10px;">Lock automatically after this much inactivity.</p>
      <div class="row" style="gap:8px;margin-bottom:16px;">
        ${[1,5,15].map(m => `
          <button onclick="setLockMinutes(${m})" class="pill" style="flex:1;padding:9px;font-size:14px;background:${LOCK_MS===m*60000?'var(--gold)':'var(--surfaceAlt)'};color:${LOCK_MS===m*60000?'var(--bg)':'var(--muted)'};">${m} min</button>`).join('')}
      </div>

      <h4 class="display" style="font-size:20px;margin:0 0 8px;">Home Screen Cards</h4>
      <p class="muted" style="font-size:14px;line-height:1.5;margin:0 0 10px;">Show or hide these on the Home tab.</p>
      <div class="stack" style="margin-bottom:16px;">
        ${[{k:'priorities',l:"Today's priorities"},{k:'leave',l:'Leave balance'},{k:'holidays',l:'Kerala holidays'},{k:'myday',l:'My Day'},{k:'habits',l:'Habits'},{k:'quicklinks',l:'Quick Links'}].map(c => `
          <button onclick="toggleHomeCard('${c.k}')" class="row" style="justify-content:space-between;width:100%;padding:8px 0;">
            <span style="font-size:15px;">${c.l}</span>
            <span style="width:38px;height:22px;border-radius:999px;background:${S.homeCards[c.k]?'var(--gold)':'var(--surfaceAlt)'};position:relative;border:1px solid var(--line);">
              <span style="position:absolute;top:1px;left:${S.homeCards[c.k]?'18px':'1px'};width:18px;height:18px;border-radius:999px;background:${S.homeCards[c.k]?'var(--bg)':'var(--muted)'};"></span>
            </span>
          </button>`).join('')}
      </div>

      <h4 class="display" style="font-size:20px;margin:0 0 8px;">Backup &amp; Restore</h4>
      <p class="muted" style="font-size:15px;line-height:1.5;margin:0 0 10px;">Encrypted backup file (still locked by your PIN). Saves to this device and opens Drive for mdrsreedevi@gmail.com.</p>
      <div class="stack" style="margin-bottom:16px;">
        <button onclick="exportBackupDeviceAndDrive()" class="btn-primary" style="width:100%;">Backup to device + Drive</button>
        <div class="row" style="gap:8px;">
          <button onclick="exportBackup()" class="btn-ghost" style="flex:1;">Device only</button>
          <button onclick="document.getElementById('restoreInputSettings').click()" class="btn-ghost" style="flex:1;">Restore</button>
        </div>
      </div>
      <input id="restoreInputSettings" type="file" accept=".json,application/json" class="hidden" onchange="handleRestoreFile(this.files[0])" />
      ${!S.settingsConfirmErase ? `
        <button onclick="S.settingsConfirmErase=true;render();" class="btn-ghost" style="width:100%;border-color:var(--coral);color:var(--coral);margin-bottom:8px;">Erase all data</button>
      ` : `
        <div class="stack" style="margin-bottom:8px;">
          <p style="font-size:16px;text-align:center;color:var(--coral);">This permanently deletes everything. Are you sure?</p>
          <div class="row" style="gap:8px;">
            <button onclick="S.settingsConfirmErase=false;render();" class="btn-ghost" style="flex:1;">Cancel</button>
            <button onclick="eraseAllData()" class="btn-danger" style="flex:1;">Yes, erase everything</button>
          </div>
        </div>
      `}
      <button onclick="toggleSettings(false)" class="muted" style="width:100%;font-size:16px;padding:8px;">Close</button>
    </div>
  </div>`;
}

/* ================= HELPERS ================= */
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function afterRender(){
  // Focus setup inputs for convenience
  const el = document.getElementById('setupPin') || document.getElementById('setupConfirm');
  if (el) el.focus();
}
// fix copy handler to use decoded text
document.addEventListener('click', (e)=>{}, false);
window.copyVaultSecret = function(id, encoded){
  const text = decodeURIComponent(encoded);
  navigator.clipboard?.writeText(text);
  S.vaultCopied = id; render();
  setTimeout(()=>{ S.vaultCopied=null; render(); }, 1200);
};
</script>
</body>
</html>
